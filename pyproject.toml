[project]
name = "pagecite"
version = "0.1.0"
description = "Async RAG platform with cited answers (API + workers)."
requires-python = ">=3.11,<3.12"
dependencies = [
    "flask>=3.1",
    "sqlalchemy>=2.0.36",
    "pymysql>=1.1",
    "cryptography>=43",        # MySQL 8 caching_sha2_password auth for PyMySQL
    "boto3>=1.38",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "gunicorn>=23",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "openai>=1.60",
    "tiktoken>=0.8",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "pytesseract>=0.3.13",
    "pillow>=11",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8",
    "pytest>=8.3",
    "pyyaml>=6.0.4",
    "requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `pytest -q` runs unit + DB tests; `pytest -m integration` (later -m wins) runs the MinIO tests.
addopts = '-m "not integration"'
markers = [
    "integration: needs the compose MinIO + MySQL (docker compose up -d mysql flyway-test minio minio-init)",
]
