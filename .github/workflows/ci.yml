# CI: unit + DB tests against MySQL 8.4 with the Flyway migrations, the web build, and the deploy config.
# On main, a green run triggers .github/workflows/deploy.yml (P5B).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (unit + DB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: pagecite_test
          MYSQL_USER: pagecite
          MYSQL_PASSWORD: pagecite-ci
          MYSQL_ROOT_PASSWORD: root-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot-ci --silent"
          --health-interval 5s --health-timeout 5s --health-retries 40
    env:
      # Read by tests/conftest.py (TestEnv). Tests build their own Settings from it.
      TEST_DATABASE_URL: mysql+pymysql://pagecite:pagecite-ci@127.0.0.1:3306/pagecite_test
      # Required Settings fields: the Celery app builds Settings() at import, which locally comes
      # from .env. CI has no .env; nothing connects with these during pytest -q.
      DATABASE_URL: mysql+pymysql://pagecite:pagecite-ci@127.0.0.1:3306/pagecite_test
      S3_BUCKET: pagecite-ci-unused
    steps:
      - uses: actions/checkout@v7

      - name: Flyway migrate (same image and migrations as docker-compose.yml)
        run: >-
          docker run --rm --network host
          -v "$GITHUB_WORKSPACE/db/migrations:/flyway/migrations:ro"
          flyway/flyway:11
          "-url=jdbc:mysql://127.0.0.1:3306/pagecite_test?allowPublicKeyRetrieval=true&useSSL=false"
          -user=pagecite -password=pagecite-ci
          -locations=filesystem:/flyway/migrations -connectRetries=30
          migrate

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Install (locked)
        run: uv sync --frozen

      - name: pytest -q
        # Integration tests (MinIO, Redis) are excluded by the default `-m "not integration"`;
        # the real-Tesseract test skips when tesseract is not installed.
        run: uv run pytest -q

  web:
    name: web build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: No PageCite key in the bundle (the demo key is served at runtime from /config.json)
        run: |
          if grep -rEn 'pca?_[A-Za-z0-9_-]{20,}' dist; then
            echo "::error::a pc_/pca_ key is in the web bundle"; exit 1
          fi

  deploy-config:
    name: deploy config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: docker-compose.prod.yml renders
        run: |
          printf '%s\n' SITE_ADDRESS=pagecite.duckdns.org MYSQL_DATABASE=pagecite MYSQL_USER=pagecite \
            MYSQL_PASSWORD=x MYSQL_ROOT_PASSWORD=y > /tmp/ci.env
          cp /tmp/ci.env .env  # env_file: .env (the real one only exists on the server)
          IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.prod.yml --env-file /tmp/ci.env --profile migrate config -q
          rm .env
      - name: Caddyfile is valid for dev (:80) and prod (HTTPS site)
        run: |
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile
          docker run --rm -e SITE_ADDRESS=pagecite.duckdns.org -e DEMO_ASK_KEY=pca_example \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile
      - name: ShellCheck the server scripts
        # The shellcheck image has no shell to expand a glob: list the files from here.
        run: |
          files=()
          for f in deploy/*.sh; do files+=("/mnt/${f#deploy/}"); done
          docker run --rm -v "$PWD/deploy:/mnt:ro" koalaman/shellcheck:stable -S warning "${files[@]}"
